# Untuk pengembangan/uji lokal: build dari source.
#   docker compose up --build
services:
  frontend:
    build:
      context: .
      args:
        # Build-time (di-inline ke bundle browser). Ubah lalu build ulang.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: shale_shaker_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    # Variabel runtime. File .env opsional untuk lokal.
    env_file:
      - path: .env
        required: false
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M

  # Reverse proxy lokal: /api -> Flask di host :5000, selain itu -> frontend.
  # Buka http://127.0.0.1:3011 (bukan :3010) untuk menguji upload video.
  # Jalankan Flask lebih dulu di mesin host (port 5000).
  proxy:
    image: nginx:1.27-alpine
    container_name: shale_shaker_proxy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "127.0.0.1:3011:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
